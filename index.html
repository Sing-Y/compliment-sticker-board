<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef1e9">
<title>칭찬 스티커판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1e9;--paper:#fbfcf8;--paper2:#f5f7f1;--ink:#344039;--muted:#7a857c;--line:#d9e0d5;--sage:#71866f;--sage-dark:#586b57;--sage-soft:#e4ebe0;--shadow:0 14px 42px rgba(61,76,62,.09)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.8),transparent 25%),radial-gradient(circle at 90% 25%,rgba(218,226,211,.6),transparent 27%),var(--bg);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:42px 18px 70px}
header{text-align:center;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:.17em;color:var(--muted);margin-bottom:11px}.decor{margin:0 auto 12px;color:var(--sage);font-size:17px;letter-spacing:9px}
h1{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-size:clamp(34px,8vw,52px);font-weight:400;letter-spacing:-.055em;margin:0 0 9px}.sub{font-size:14px;color:var(--muted)}
.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:end;margin-bottom:14px;flex-wrap:wrap}.setting{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.setting label{font-size:12px;color:var(--muted)}
input,select{padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:rgba(251,252,248,.9);color:var(--ink);outline:none}input{width:240px}select{min-width:105px}
input:focus,select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(113,134,111,.12)}
.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:13px;padding:11px 15px;font-weight:600;transition:transform .15s,background .15s,border-color .15s}.btn:hover{transform:translateY(-1px);border-color:#c4cec0}.btn.primary{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff}.btn.primary:hover{background:#4e604d}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.card{background:rgba(251,252,248,.95);border:1px solid var(--line);border-radius:28px;padding:25px;box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;gap:12px}.title{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-size:25px}.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.slot{position:relative;aspect-ratio:1;border:1px dashed #cbd4c7;background:var(--paper2);border-radius:19px;display:grid;place-items:center;color:#a7b0a6;font-size:13px;transition:transform .16s,border-color .16s,background .16s}.slot:hover{transform:translateY(-2px);border-color:var(--sage)}.slot:focus-visible{outline:3px solid #b9c7b4;outline-offset:2px}.slot.on{border-style:solid;background:var(--sage-soft);color:var(--sage-dark);animation:pop .24s ease-out}
.sticker{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;font-size:28px;line-height:1;filter:drop-shadow(0 2px 1px rgba(64,77,65,.08))}
.sticker.leaf{background:#dbe6d5}.sticker.flower{background:#eee0dc}.sticker.clover{background:#e2eadc}.sticker.star{background:#eee9d1}
@keyframes pop{0%{transform:scale(.68);opacity:.25}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.controls{text-align:center;margin-top:19px}.hint{text-align:center;color:var(--muted);font-size:12px;margin:11px 0 0}
.complete{margin-top:18px;padding:19px;border-radius:19px;text-align:center;background:var(--sage-soft);border:1px solid #d4dfcf}.complete strong{font-family:"Gowun Dodum",sans-serif;font-size:23px;font-weight:400}.complete p{margin:5px 0 0;color:var(--muted);font-size:13px}
.history{margin-top:37px}.historyhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.historyhead h2{font-family:"Gowun Dodum",sans-serif;font-size:19px;font-weight:400;margin:0}.historyhead span{font-size:12px;color:var(--muted)}
.archive{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start}
.archivecard{width:92px;min-height:88px;background:rgba(251,252,248,.9);border:1px solid var(--line);border-radius:13px;padding:8px;box-shadow:0 4px 12px rgba(61,76,62,.04)}
.archivehead{display:block;margin-bottom:6px;overflow:hidden}.archivehead b{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.archivehead small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.mini i{aspect-ratio:1;border-radius:3px;background:var(--sage-soft);border:1px solid #d5dfd1}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:21px;border:1px dashed var(--line);border-radius:16px;background:rgba(251,252,248,.45);width:100%}
.note{margin-top:25px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);background:#3d4a40;color:#fff;padding:11px 17px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:650px){.toolbar{align-items:stretch}.toolbar .setting{width:100%}.toolbar .setting input{flex:1;min-width:0}.toolbar .actions{width:100%}.toolbar .actions .btn{flex:1}}
@media(max-width:520px){.wrap{padding:30px 13px 55px}.toolbar .setting{display:grid;grid-template-columns:auto 1fr auto}.toolbar .setting input{width:100%}.toolbar .actions{display:grid;grid-template-columns:1fr 1fr}.card{padding:16px;border-radius:22px}.grid{gap:7px}.slot{border-radius:14px}.sticker{width:44px;height:44px;font-size:23px}.cardhead{align-items:center}.archivecard{width:84px;min-height:80px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.slot,.btn,.slot.on{transition:none;animation:none}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div class="decor">❧　☘　❧</div>
  <div class="eyebrow">A SMALL RECORD OF GOOD THINGS</div>
  <h1>칭찬 스티커판</h1>
  <div class="sub">작은 성취를 하나씩 기록하고, 한 판씩 천천히 쌓아보세요.</div>
</header>

<div class="toolbar">
  <div class="setting">
    <label for="name">판 이름</label>
    <input id="name" maxlength="40" placeholder="예: 9월의 나">
    <label for="boardSize">칸 수</label>
    <select id="boardSize" aria-label="스티커판 칸 수"></select>
  </div>
  <div class="actions">
    <button class="btn" id="reset" type="button">현재 판 초기화</button>
    <button class="btn primary" id="new" type="button">새 판 만들기</button>
  </div>
</div>

<section class="card">
  <div class="cardhead"><div class="title" id="title">첫 번째 판</div><div class="count" id="count">0 / 20</div></div>
  <div class="grid" id="grid" aria-label="칭찬 스티커판"></div>
  <div class="controls"><button class="btn primary" id="add" type="button">＋ 스티커 하나 붙이기</button></div>
  <p class="hint">원하는 칸을 눌러 스티커를 붙이세요. 붙은 칸을 다시 누르면 떼어낼 수 있어요.</p>
  <div class="complete" id="complete" hidden><strong>☘ 한 판을 완성했어요 ☘</strong><p>새 판을 만들면 이 기록은 아래에 작은 카드로 보관됩니다.</p></div>
</section>

<section class="history">
  <div class="historyhead"><h2>완성한 판</h2><span id="historyCount">0개</span></div>
  <div class="archive" id="archive"></div>
</section>

<div class="note">기록은 이 브라우저에 자동 저장됩니다.<br>같은 기기·같은 브라우저에서 다시 열어도 이어서 사용할 수 있어요.</div>
</main>
<div class="toast" id="toast" aria-live="polite"></div>

<script>
(() => {
  const KEY="compliment-sticker-board-v4";
  const MIN=15, MAX=31;
  const stickers=[
    ["leaf","☘"],["flower","✿"],["clover","♧"],["star","✦"],
    ["leaf","❧"],["flower","❀"],["clover","☘"],["star","✺"]
  ];
  let state={current:{name:"",marks:[],size:20},history:[]};
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.current&&Array.isArray(s.current.marks)){
      state=s;
      state.current.size=Math.max(MIN,Math.min(MAX,Number(state.current.size)||20));
      state.current.marks=state.current.marks.filter(n=>Number.isInteger(n)&&n>=0&&n<state.current.size);
    }
  }catch(e){}
  const $=id=>document.getElementById(id);
  const grid=$("grid"),title=$("title"),count=$("count"),name=$("name"),size=$("boardSize"),archive=$("archive"),hc=$("historyCount"),complete=$("complete"),add=$("add");

  for(let n=MIN;n<=MAX;n++){const o=document.createElement("option");o.value=n;o.textContent=`${n}개`;size.appendChild(o)}

  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function titleText(){return state.current.name.trim()||`${state.history.length+1}번째 판`}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
  function toast(t){const x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove("show"),1700)}
  function render(){
    const a=state.current.marks;
    title.textContent=titleText();count.textContent=`${a.length} / ${state.current.size}`;name.value=state.current.name;size.value=state.current.size;
    grid.style.gridTemplateColumns=window.innerWidth<520?"repeat(5,1fr)":"repeat(5,1fr)";
    grid.innerHTML="";
    for(let i=0;i<state.current.size;i++){
      const on=a.includes(i),b=document.createElement("button");
      b.type="button";b.className="slot"+(on?" on":"");
      const [kind,symbol]=stickers[i%stickers.length];
      b.innerHTML=on?`<span class="sticker ${kind}">${symbol}</span>`:String(i+1);
      b.setAttribute("aria-label",`${i+1}번 칸 ${on?"스티커 있음":"비어 있음"}`);
      b.addEventListener("click",()=>toggle(i));grid.appendChild(b);
    }
    add.disabled=a.length>=state.current.size;
    complete.hidden=a.length!==state.current.size;
    renderHistory();
  }
  function toggle(i){
    const a=state.current.marks,pos=a.indexOf(i);
    if(pos>=0)a.splice(pos,1);else if(a.length<state.current.size)a.push(i);
    save();render();
    if(a.length===state.current.size)toast("모든 칸을 채웠어요. 한 판 완성 ✦");
  }
  function renderHistory(){
    hc.textContent=`${state.history.length}개`;
    if(!state.history.length){archive.innerHTML='<div class="empty">완성한 판이 여기에 작은 카드로 차곡차곡 쌓입니다.</div>';return}
    archive.innerHTML=state.history.map((h,i)=>{
      const cells=Array.from({length:h.size||20},()=>"<i></i>").join("");
      return `<article class="archivecard"><div class="archivehead"><b>${esc(h.name||`${i+1}번째 판`)}</b><small>${esc(h.date)} · ${h.size||20}개</small></div><div class="mini">${cells}</div></article>`;
    }).join("");
  }
  add.addEventListener("click",()=>{
    if(state.current.marks.length<state.current.size){
      for(let i=0;i<state.current.size;i++)if(!state.current.marks.includes(i)){state.current.marks.push(i);break}
      save();render();
      if(state.current.marks.length===state.current.size)toast("모든 칸을 채웠어요. 한 판 완성 ✦");
    }
  });
  $("reset").addEventListener("click",()=>{
    if(confirm("현재 판의 스티커를 모두 지울까요?")){state.current.marks=[];save();render();}
  });
  size.addEventListener("change",()=>{
    const next=Math.max(MIN,Math.min(MAX,Number(size.value)||20));
    if(state.current.marks.length>next){
      if(!confirm(`칸 수를 ${next}개로 줄이면 뒤쪽 스티커가 사라질 수 있어요. 변경할까요?`)){size.value=state.current.size;return}
      state.current.marks=state.current.marks.filter(i=>i<next);
    }
    state.current.size=next;save();render();toast(`${next}칸 스티커판으로 설정했어요.`);
  });
  $("reset").addEventListener("dblclick",()=>{});
  $("new").addEventListener("click",()=>{
    if(state.current.marks.length===state.current.size){
      state.history.unshift({name:titleText(),date:new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"short",day:"numeric"}),size:state.current.size});
    }else if(state.current.marks.length>0){
      if(!confirm("현재 판은 아직 완성되지 않았습니다. 저장하지 않고 새 판을 만들까요?"))return;
    }else if(state.current.name.trim()){
      if(!confirm("빈 판을 저장하지 않고 새 판을 만들까요?"))return;
    }
    state.current={name:"",marks:[],size:20};save();render();toast("새 판을 만들었어요.");
  });
  name.addEventListener("input",()=>{state.current.name=name.value;save();title.textContent=titleText()});
  window.addEventListener("resize",()=>{});
  render();
})();
</script>
</body>
</html>
