<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>칭찬 스티커판</title>
<style>
:root{--sage:#8ea995;--sage2:#dfe9df;--cream:#fbfaf5;--ink:#33423a;--line:#d5ddd4}
*{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:720px;margin:auto;padding:28px 16px 50px}
h1{margin:0;text-align:center;font-size:28px}.sub{text-align:center;color:#718078;margin:8px 0 22px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 6px 24px #00000008}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--sage);color:white;border:0;font-weight:700}.ghost{background:var(--sage2);color:var(--ink)}
.status{text-align:center;font-size:13px;color:#718078;margin:10px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:18px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed #bfcbbf;background:#fafcf8;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;position:relative}
.slot:hover{transform:scale(1.03)} .slot.filled{border-style:solid;background:#eef4ec}
.sticker{width:72%;height:72%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;background:#dce9dc}
.s1{background:#dce9dc}.s2{background:#f3e5bf}.s3{background:#e6d9ea}.s4{background:#d8e5ed}
.archive{margin-top:22px}.archive h2{font-size:18px}.history{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini{border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff;text-align:center}.miniTitle{font-size:12px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniDots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.dot{aspect-ratio:1;border-radius:50%;background:#e8eee8}.dot.on{background:var(--sage)}
@media(max-width:520px){.wrap{padding:20px 12px}.board{gap:10px}.sticker{font-size:22px}.history{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>칭찬 스티커판</h1>
  <div class="sub">오늘의 작은 칭찬을 하나씩 모아보세요 🌿</div>
  <div class="card">
    <div class="row">
      <input id="name" value="칭찬 스티커판" maxlength="30" aria-label="판 이름">
      <select id="size"><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option selected>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
      <button id="new">새 판</button>
      <button id="reset" class="ghost">초기화</button>
    </div>
    <div id="status" class="status">Firebase 연결 준비 중…</div>
    <div id="board" class="board"></div>
    <div class="row" style="margin-top:18px;margin-bottom:0"><button id="add">스티커 붙이기</button></div>
  </div>
  <div class="archive"><h2>완성한 스티커판</h2><div id="history" class="history"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, update, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

/* =========================
   여기의 Firebase 설정 6개만
   새 Firebase 프로젝트에서 받은 값으로 바꾸세요.
   ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyCcPlqY6rqoYmzw0hsg1GuUuu-eSiU7X-0",
  authDomain: "compliment-sticker-board-3ff6a.firebaseapp.com",
  projectId: "compliment-sticker-board-3ff6a",
  databaseURL: "https://compliment-sticker-board-3ff6a-default-rtdb.asia-southeast1.firebasedatabase.app",
  storageBucket: "compliment-sticker-board-3ff6a.firebasestorage.app",
  messagingSenderId: "350196995341",
  appId: "1:350196995341:web:2f3e60a99698ea0bf70c44"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const currentRef = ref(db, "board/current");
const historyRef = ref(db, "board/history");

let current = null, history = {}, uid = null;

const $ = id => document.getElementById(id);
function setStatus(t, bad=false){ $("status").textContent=t; $("status").style.color=bad?"#b44":"#718078"; }

onAuthStateChanged(auth, user => {
  if(user){ uid=user.uid; setStatus("● 실시간 연결됨"); listen(); }
});
signInAnonymously(auth).catch(e=>{
  console.error(e);
  setStatus("Firebase 연결 실패: " + (e.code || e.message), true);
});

function listen(){
  onValue(currentRef, s=>{
    current=s.val();
    if(!current){
      current={name:"칭찬 스티커판",size:20,marks:{}};
      update(ref(db,"board/current"),current);
    }
    $("name").value=current.name||"칭찬 스티커판";
    $("size").value=String(current.size||20);
    render();
  });
  onValue(historyRef, s=>{ history=s.val()||{}; renderHistory(); });
}

function render(){
  const n=Number(current?.size||20), marks=current?.marks||{};
  const b=$("board"); b.innerHTML="";
  for(let i=0;i<n;i++){
    const d=document.createElement("div"); d.className="slot"+(marks[i]?" filled":"");
    d.onclick=()=>toggle(i);
    if(marks[i]){
      const x=document.createElement("div");
      x.className="sticker s"+marks[i];
      x.textContent=["","•","○","✦","·"][marks[i]];
      d.appendChild(x);
    }
    b.appendChild(d);
  }
}
async function toggle(i){
  const r=ref(db,`board/current/marks/${i}`);
  await runTransaction(r,v=>v?null:((i%4)+1));
  checkComplete();
}
async function checkComplete(){
  const marks=current?.marks||{};
  if(Object.keys(marks).length >= Number(current.size)){
    const id=push(historyRef).key;
    await update(ref(db),{
      [`board/history/${id}`]:{...current,completedAt:Date.now()},
      "board/current":{name:"새 칭찬 스티커판",size:Number(current.size),marks:{}}
    });
  }
}
$("add").onclick=()=>{
  const n=Number(current?.size||20), marks=current?.marks||{};
  const empty=[...Array(n).keys()].find(i=>!marks[i]);
  if(empty!==undefined) toggle(empty);
};
$("reset").onclick=()=>update(currentRef,{...current,marks:{}});
$("new").onclick=()=>update(currentRef,{name:"새 칭찬 스티커판",size:Number($("size").value),marks:{}});
$("name").onchange=()=>update(ref(db,"board/current/name"),$("name").value);
$("size").onchange=()=>update(ref(db,"board/current"),{...current,size:Number($("size").value),marks:{}});

function renderHistory(){
  const box=$("history"); box.innerHTML="";
  Object.values(history).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0)).forEach(h=>{
    const m=document.createElement("div"); m.className="mini";
    m.innerHTML=`<div class="miniTitle">${escapeHtml(h.name||"완성한 판")}</div>`;
    const dots=document.createElement("div"); dots.className="miniDots";
    for(let i=0;i<Number(h.size||20);i++){const d=document.createElement("div");d.className="dot on";dots.appendChild(d)}
    m.appendChild(dots);box.appendChild(m);
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
