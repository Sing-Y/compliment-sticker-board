<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f2ed">
<title>칭찬 스티커판</title>
<style>
:root{--bg:#f5f2ed;--paper:#fffdf9;--ink:#292724;--muted:#827b72;--line:#e4ddd4;--accent:#876c47;--soft:#eee5d9;--shadow:0 14px 40px rgba(45,37,28,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:44px 18px 70px}
header{text-align:center;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:9px}
h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(34px,8vw,52px);font-weight:500;letter-spacing:-.045em;margin:0 0 9px}.sub{font-size:14px;color:var(--muted)}
.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap}
input{width:220px;max-width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);outline:none}input:focus{border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 15px;font-weight:650}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--paper);border:1px solid var(--line);border-radius:25px;padding:24px;box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:19px;gap:12px}.title{font-family:Georgia,"Noto Serif KR",serif;font-size:25px}.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.slot{aspect-ratio:1;border:1px dashed #d4ccc1;background:#faf7f2;border-radius:18px;display:grid;place-items:center;color:#aaa197;font-size:13px;transition:transform .15s,border-color .15s,background .15s}
.slot:hover{transform:translateY(-2px);border-color:var(--accent)}.slot:focus-visible{outline:3px solid #cdb99e;outline-offset:2px}
.slot.on{border-style:solid;background:var(--soft);color:var(--accent);animation:pop .22s ease-out}.mark{font-size:31px;line-height:1}
@keyframes pop{0%{transform:scale(.7);opacity:.35}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.controls{text-align:center;margin-top:18px}.hint{text-align:center;color:var(--muted);font-size:12px;margin:11px 0 0}
.complete{margin-top:18px;padding:18px;border-radius:18px;text-align:center;background:var(--soft)}.complete strong{font-family:Georgia,"Noto Serif KR",serif;font-size:23px;font-weight:500}.complete p{margin:5px 0 0;color:var(--muted);font-size:13px}
.history{margin-top:35px}.historyhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.historyhead h2{font-size:16px;margin:0}.historyhead span{font-size:12px;color:var(--muted)}
.archive{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.archivecard{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:15px}.archivehead{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}.archivehead b{font-size:14px}.archivehead small{font-size:11px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.mini i{aspect-ratio:1;border-radius:6px;background:var(--soft);border:1px solid #ddcfbd}.empty{text-align:center;color:var(--muted);font-size:13px;padding:20px;border:1px dashed var(--line);border-radius:15px}
.note{margin-top:25px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);background:#292724;color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.wrap{padding:30px 13px 55px}.toolbar{align-items:stretch}.toolbar>div{width:100%}.toolbar input{width:100%}.toolbar .btn{width:100%}.card{padding:16px;border-radius:21px}.grid{gap:7px}.slot{border-radius:13px}.mark{font-size:26px}.cardhead{align-items:center}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div class="eyebrow">A SMALL RECORD OF GOOD THINGS</div>
  <h1>칭찬 스티커판</h1>
  <div class="sub">작은 성취를 하나씩 기록하고, 한 판씩 쌓아보세요.</div>
</header>

<div class="toolbar">
  <div><input id="name" maxlength="40" placeholder="현재 판 이름  ·  예: 9월의 나" aria-label="현재 판 이름"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="reset" type="button">현재 판 초기화</button>
    <button class="btn primary" id="new" type="button">새 판 만들기</button>
  </div>
</div>

<section class="card">
  <div class="cardhead"><div class="title" id="title">첫 번째 판</div><div class="count" id="count">0 / 20</div></div>
  <div class="grid" id="grid"></div>
  <div class="controls"><button class="btn primary" id="add" type="button">＋ 스티커 붙이기</button></div>
  <p class="hint">20개의 칸 중 원하는 칸을 눌러 스티커를 붙이세요. 붙은 칸을 다시 누르면 제거됩니다.</p>
  <div class="complete" id="complete" hidden><strong>✦ 한 판 완성 ✦</strong><p>좋아요. 이 판을 저장하고 새로운 판을 시작할 수 있어요.</p></div>
</section>

<section class="history">
  <div class="historyhead"><h2>완성한 판</h2><span id="historyCount">0개</span></div>
  <div class="archive" id="archive"></div>
</section>
<div class="note">이 버전은 별도 서버 없이 브라우저에 기록을 저장합니다.<br>같은 기기·같은 브라우저에서 다시 열어도 기록이 유지됩니다.</div>
</main>
<div class="toast" id="toast" aria-live="polite"></div>

<script>
(() => {
  const KEY="compliment-sticker-board-v2";
  let state={current:{name:"",marks:[]},history:[]};
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.current&&Array.isArray(s.current.marks))state=s}catch(e){}
  const $=id=>document.getElementById(id);
  const grid=$("grid"), title=$("title"), count=$("count"), name=$("name"), archive=$("archive"), hc=$("historyCount"), complete=$("complete"), add=$("add");
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function titleText(){return state.current.name.trim()||`${state.history.length+1}번째 판`}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
  function toast(t){const x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(window._t);window._t=setTimeout(()=>x.classList.remove("show"),1600)}
  function render(){
    title.textContent=titleText(); count.textContent=`${state.current.marks.length} / 20`; name.value=state.current.name;
    grid.innerHTML="";
    for(let i=0;i<20;i++){
      const b=document.createElement("button"); b.type="button"; b.className="slot"+(state.current.marks.includes(i)?" on":"");
      b.innerHTML=state.current.marks.includes(i)?'<span class="mark">✦</span>':String(i+1);
      b.setAttribute("aria-label",`${i+1}번 칸 ${state.current.marks.includes(i)?"스티커 있음":"비어 있음"}`);
      b.addEventListener("click",()=>toggle(i)); grid.appendChild(b);
    }
    add.disabled=state.current.marks.length>=20;
    complete.hidden=state.current.marks.length!==20;
    renderHistory();
  }
  function toggle(i){
    const a=state.current.marks, pos=a.indexOf(i);
    if(pos>=0)a.splice(pos,1); else if(a.length<20)a.push(i);
    save();render();
  }
  function renderHistory(){
    hc.textContent=`${state.history.length}개`;
    if(!state.history.length){archive.innerHTML='<div class="empty">완성한 판이 여기에 차곡차곡 쌓입니다.</div>';return}
    archive.innerHTML=state.history.map((h,i)=>{
      const cells=Array.from({length:20},()=>"<i></i>").join("");
      return `<article class="archivecard"><div class="archivehead"><b>${esc(h.name||`${i+1}번째 판`)}</b><small>${esc(h.date)}</small></div><div class="mini">${cells}</div></article>`;
    }).join("");
  }
  add.addEventListener("click",()=>{
    if(state.current.marks.length<20){for(let i=0;i<20;i++)if(!state.current.marks.includes(i)){state.current.marks.push(i);break}save();render();if(state.current.marks.length===20)toast("한 판을 완성했어요 ✦")}
  });
  $("reset").addEventListener("click",()=>{if(confirm("현재 판의 스티커를 모두 지울까요?")){state.current.marks=[];save();render();}});
  $("new").addEventListener("click",()=>{
    if(state.current.marks.length===20){
      state.history.unshift({name:titleText(),date:new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"short",day:"numeric"})});
    }else if(state.current.marks.length>0){
      if(!confirm("현재 판은 아직 완성되지 않았습니다. 저장하지 않고 새 판을 만들까요?"))return;
    }else if(state.current.name.trim()){
      if(!confirm("빈 판을 저장하지 않고 새 판을 만들까요?"))return;
    }
    state.current={name:"",marks:[]};save();render();toast("새 판을 만들었습니다.");
  });
  name.addEventListener("input",()=>{state.current.name=name.value;save();title.textContent=titleText()});
  render();
})();
</script>
</body>
</html>
