<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>칭찬 스티커판</title>
<style>
:root{--sage:#879f8d;--sage-deep:#617b69;--sage-soft:#e7eee7;--cream:#f8f7f1;--paper:#fffefa;--ink:#344039;--muted:#78837c;--line:#d9e0d8;--gold:#d9b96f;--pink:#d9a7ae;--lav:#b9a8c8;}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
.wrap{max-width:760px;margin:auto;padding:24px 16px 56px}
.hero{text-align:center;padding:4px 0 20px}
.heroArt{height:58px;display:flex;align-items:center;justify-content:center;gap:26px;color:var(--sage-deep);font-size:23px;letter-spacing:2px}
.heroArt .small{font-size:15px;opacity:.8}.heroArt .flower{font-size:21px}.heroArt .spark{font-size:22px}
.eyebrow{font-family:Georgia,"Times New Roman",serif;letter-spacing:3px;font-size:11px;color:#728078;margin-bottom:12px}
h1{margin:0;font-family:"Noto Serif KR",Georgia,serif;font-weight:500;font-size:38px;letter-spacing:-1.8px;color:#26312b}
.sub{text-align:center;color:#69766f;margin:12px 0 24px;font-size:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 10px 30px rgba(49,66,57,.06)}
.row{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
input,select{border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:#fff;color:var(--ink);outline:none}
input{min-width:180px;text-align:center}select{min-width:70px}
button{cursor:pointer;border:0;border-radius:13px;padding:10px 14px;background:var(--sage);color:white;font-weight:700;transition:transform .12s,opacity .12s}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(0)}button:disabled{opacity:.45;cursor:default;transform:none}
.ghost{background:var(--sage-soft);color:var(--ink)}
.status{text-align:center;font-size:13px;color:var(--muted);margin:8px 0 4px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:18px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed #bdc9bf;background:#fbfcf8;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;position:relative}
.slot:hover{transform:scale(1.025)}
.slot.filled{border-style:solid;background:#f0f5ee}
.sticker{width:76%;height:76%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:31px;line-height:1;font-weight:500;box-shadow:inset 0 0 0 1px rgba(70,85,75,.06)}
.s1{background:#e2eee1}.s2{background:#f5e8c6}.s3{background:#ece2f0}.s4{background:#e0ebef}
.sticker .icon{transform:translateY(-1px)}
.actions{margin-top:18px;margin-bottom:0}
.archive{margin-top:28px}.archiveHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.archive h2{font-size:18px;margin:0}.archiveNote{font-size:12px;color:var(--muted)}
.history{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini{border:1px solid var(--line);border-radius:17px;padding:10px;background:rgba(255,255,255,.82);text-align:center}
.miniTitle{font-size:12px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniDots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:9px}.dot{aspect-ratio:1;border-radius:50%;background:#e6ece6;display:flex;align-items:center;justify-content:center;font-size:9px}.dot.on{background:#edf4eb;color:#708473}
.miniBtns{display:flex;gap:5px}.miniBtns button{flex:1;padding:7px 4px;border-radius:9px;font-size:11px}.miniBtns .delete{background:#f2eeea;color:#746e68}
.emptyHistory{text-align:center;color:var(--muted);font-size:13px;padding:18px 8px;border:1px dashed var(--line);border-radius:15px}
@media(max-width:560px){.wrap{padding:18px 12px 42px}.hero{padding-top:0}.heroArt{height:48px;gap:20px;font-size:20px}.heroArt .small{font-size:13px}.heroArt .flower{font-size:18px}.heroArt .spark{font-size:19px}.eyebrow{font-size:10px;letter-spacing:2.4px}h1{font-size:34px}.sub{font-size:14px;margin:10px 0 20px}.card{padding:15px;border-radius:23px}.board{gap:9px}.sticker{font-size:25px}.history{grid-template-columns:repeat(3,1fr)}.mini{padding:8px}.archiveNote{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="heroArt" aria-hidden="true">
      <span class="small">☘</span><span>✿</span><span class="spark">✦</span><span class="flower">❀</span><span class="small">☘</span>
    </div>
    <div class="eyebrow">A SMALL RECORD OF GOOD THINGS</div>
    <h1>칭찬 스티커판</h1>
    <div class="sub">오늘도 수고한 당신에게 칭찬을 드립니다 😊 ✨</div>
  </header>

  <div class="card">
    <div class="row">
      <input id="name" value="칭찬 스티커판" maxlength="30" aria-label="판 이름">
      <select id="size" aria-label="스티커 개수"><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option selected>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
      <button id="new">새 판</button>
      <button id="reset" class="ghost">초기화</button>
    </div>
    <div id="status" class="status">Firebase 연결 준비 중…</div>
    <div id="board" class="board"></div>
    <div class="row actions"><button id="add">스티커 붙이기</button></div>
  </div>

  <section class="archive">
    <div class="archiveHead"><h2>완성한 스티커판</h2><div class="archiveNote">복구하거나 삭제할 수 있어요</div></div>
    <div id="history" class="history"></div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, update, push, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcPlYq6rqoYmzw0hsg1GuUuu-eSiU7X-0",
  authDomain: "compliment-sticker-board-3ff6a.firebaseapp.com",
  projectId: "compliment-sticker-board-3ff6a",
  databaseURL: "https://compliment-sticker-board-3ff6a-default-rtdb.asia-southeast1.firebasedatabase.app",
  storageBucket: "compliment-sticker-board-3ff6a.firebasestorage.app",
  messagingSenderId: "350196995341",
  appId: "1:350196995341:web:2f3e60a99698ea0bf70c44"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const currentRef = ref(db, "board/current");
const historyRef = ref(db, "board/history");

let current = null, history = {}, uid = null;
const $ = id => document.getElementById(id);
function setStatus(t,bad=false){$("status").textContent=t;$("status").style.color=bad?"#b44":"#718078";}

onAuthStateChanged(auth,user=>{
  if(user){uid=user.uid;setStatus("● 실시간 연결됨");listen();}
});
signInAnonymously(auth).catch(e=>{console.error(e);setStatus("Firebase 연결 실패: "+(e.code||e.message),true);});

function listen(){
  onValue(currentRef,s=>{
    current=s.val();
    if(!current){
      current={name:"칭찬 스티커판",size:20,marks:{}};
      update(currentRef,current);
    }
    $("name").value=current.name||"칭찬 스티커판";
    $("size").value=String(current.size||20);
    render();
  });
  onValue(historyRef,s=>{history=s.val()||{};renderHistory();});
}

function render(){
  const n=Number(current?.size||20),marks=current?.marks||{};
  const b=$("board");b.innerHTML="";
  for(let i=0;i<n;i++){
    const d=document.createElement("div");d.className="slot"+(marks[i]?" filled":"");d.onclick=()=>toggle(i);
    if(marks[i]){
      const x=document.createElement("div");x.className="sticker s"+marks[i];
      const icon=document.createElement("span");icon.className="icon";
      icon.textContent=["","☘","❀","✦","✿"][marks[i]];
      x.appendChild(icon);d.appendChild(x);
    }
    b.appendChild(d);
  }
}

async function toggle(i){
  if(!current||current.finishing)return;
  const result=await runTransaction(currentRef,board=>{
    if(!board)return board;
    const marks=board.marks||{};
    const next={...board,marks:{...marks}};
    if(next.marks[i]) delete next.marks[i];
    else next.marks[i]=(i%4)+1;
    return next;
  });
  if(result.committed){
    const board=result.snapshot.val();
    await maybeComplete(board);
  }
}

async function maybeComplete(board){
  if(!board||board.finishing)return;
  const n=Number(board.size||20),marks=board.marks||{};
  if(Object.keys(marks).length<n)return;

  const lock=await runTransaction(currentRef,v=>{
    if(!v||v.finishing)return;
    const m=v.marks||{};
    if(Object.keys(m).length<Number(v.size||20))return;
    return {...v,finishing:true};
  });
  if(!lock.committed)return;

  const finished=lock.snapshot.val();
  const id=push(historyRef).key;
  await update(ref(db),{
    [`board/history/${id}`]:{name:finished.name||"완성한 판",size:Number(finished.size||20),marks:finished.marks||{},completedAt:Date.now()},
    "board/current":{name:"새 칭찬 스티커판",size:Number(finished.size||20),marks:{}}
  });
}

$("add").onclick=async()=>{
  if(!current)return;
  const n=Number(current.size||20),marks=current.marks||{};
  const empty=[...Array(n).keys()].find(i=>!marks[i]);
  if(empty!==undefined)await toggle(empty);
};
$("reset").onclick=()=>{if(current&&!current.finishing)update(currentRef,{...current,marks:{}})};
$("new").onclick=()=>update(currentRef,{name:"새 칭찬 스티커판",size:Number($("size").value),marks:{}});
$("name").onchange=()=>update(ref(db,"board/current/name"),$("name").value);
$("size").onchange=()=>update(currentRef,{...current,size:Number($("size").value),marks:{}});

function renderHistory(){
  const box=$("history");box.innerHTML="";
  const items=Object.entries(history).sort((a,b)=>(b[1].completedAt||0)-(a[1].completedAt||0));
  if(!items.length){box.innerHTML='<div class="emptyHistory">아직 완성한 판이 없어요 🌿<br>스티커를 하나씩 모아보세요.</div>';return;}
  items.forEach(([id,h])=>{
    const m=document.createElement("div");m.className="mini";
    m.innerHTML=`<div class="miniTitle">${escapeHtml(h.name||"완성한 판")}</div>`;
    const dots=document.createElement("div");dots.className="miniDots";
    const icons=["","☘","❀","✦","✿"];
    for(let i=0;i<Number(h.size||20);i++){
      const d=document.createElement("div");d.className="dot on";d.textContent=icons[(h.marks&&h.marks[i])||((i%4)+1)];dots.appendChild(d);
    }
    m.appendChild(dots);
    const btns=document.createElement("div");btns.className="miniBtns";
    const restore=document.createElement("button");restore.textContent="복구";restore.onclick=()=>restoreBoard(id,h);
    const del=document.createElement("button");del.textContent="삭제";del.className="delete";del.onclick=()=>deleteHistory(id);
    btns.append(restore,del);m.appendChild(btns);box.appendChild(m);
  });
}

async function restoreBoard(id,h){
  if(!confirm("이 완성판을 현재 스티커판으로 복구할까요?\n현재 진행 중인 판은 바뀝니다."))return;
  await update(currentRef,{name:h.name||"복구한 칭찬 스티커판",size:Number(h.size||20),marks:h.marks||{}});
}
async function deleteHistory(id){
  if(!confirm("이 완성한 스티커판을 삭제할까요?\n삭제하면 되돌릴 수 없어요."))return;
  await remove(ref(db,`board/history/${id}`));
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
