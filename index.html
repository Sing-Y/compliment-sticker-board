<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>칭찬 스티커판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--sage:#8da88d;--sage-dark:#607d63;--cream:#fbfaf5;--ink:#526255;--line:#d9e1d6;--pink:#e9b7b7;--yellow:#e8cf8b;--lav:#bdb9d9;--mint:#b9d2bf}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f7faf4 0%,#fbfaf5 55%,#f4f7f0 100%);color:var(--ink);font-family:"Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:auto;padding:28px 18px 55px}
.hero{text-align:center;margin-bottom:18px}
.kicker{font-size:11px;letter-spacing:3px;color:#93a192;margin-bottom:8px}
h1{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-size:36px;font-weight:400;margin:0 0 9px;color:#506a55}
.sub{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-size:17px;color:#68766b;margin:0}
.board{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 12px 35px rgba(74,92,76,.08)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.title{font-family:"Gowun Dodum";font-size:22px;color:#5b725e}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;cursor:pointer}
button:hover{background:#f3f7f1}
.primary{background:#78957b;color:white;border-color:#78957b;font-weight:600}
.primary:hover{background:#6d896f}
.namerow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.namerow label{font-size:12px;color:#68806c;white-space:nowrap}
.namerow input{flex:1;font:inherit;font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-size:16px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px}
.namerow input:focus{outline:2px solid var(--sage);outline-offset:1px}
.status{font-size:12px;color:#68806c;margin:0 0 15px}
.cardname{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-size:14px;font-weight:600;color:#5b725e;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.error{color:#b55e5e}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed #cbd7ca;background:#fafcf8;display:flex;align-items:center;justify-content:center;font-size:39px;cursor:pointer;transition:.18s;user-select:none}
.slot:hover{transform:translateY(-2px);background:#f3f8f1}
.slot.filled{border-style:solid;background:#fffdf8;box-shadow:0 5px 14px rgba(90,100,80,.08)}
.sticker1{color:#8da88d}.sticker2{color:#d9a8ad}.sticker3{color:#d4bb69}.sticker4{color:#a9a5ce}
.actions{display:flex;justify-content:center;gap:9px;margin-top:20px;flex-wrap:wrap}
.note{text-align:center;font-family:"Gowun Dodum";font-size:15px;color:#89958b;margin:16px 0 0}
.section{margin-top:38px}
.section h2{font-family:"Gowun Dodum";font-weight:400;text-align:center;font-size:23px;color:#5b725e;margin:0 0 16px}
.history{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:12px}
.carddate{font-size:11px;color:#8a968c;margin-bottom:9px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px}
.mini span{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:#f7f9f5;color:#91a190}
.cardbtns{display:flex;gap:5px}
.cardbtns button{font-size:11px;padding:6px 8px;flex:1}
.empty{text-align:center;color:#9aa59c;font-size:13px;padding:18px}
@media(max-width:600px){
 .wrap{padding:20px 12px 42px}.kicker{font-size:9px;letter-spacing:2px}h1{font-size:29px}.sub{font-size:15px}.board{padding:17px;border-radius:22px}.toprow{margin-bottom:13px}.title{font-size:20px}.grid{gap:9px}.slot{font-size:30px}.actions button{flex:1}.history{grid-template-columns:repeat(2,1fr)}
 .namerow{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="kicker">A SMALL RECORD OF GOOD THINGS</div>
  <h1>칭찬 스티커판</h1>
  <p class="sub">오늘도 수고한 당신에게 칭찬을 드립니다 😊 ✨</p>
</header>

<main class="board">
  <div class="toprow">
    <div class="title">오늘의 칭찬을 하나씩 모아보세요</div>
    <div class="controls">
      <label for="size" style="font-size:12px">칸 수</label>
      <select id="size"><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option selected>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
      <button id="newBtn">새 판</button><button id="resetBtn">초기화</button>
    </div>
  </div>
  <div class="namerow">
    <label for="boardName">이름</label>
    <input id="boardName" type="text" maxlength="30" placeholder="스티커판 이름을 입력하세요 (예: 9월 3주차)">
  </div>
  <div id="status" class="status">● 연결 중...</div>
  <div id="grid" class="grid"></div>
  <div class="actions"><button class="primary" id="addBtn">스티커 붙이기</button></div>
  <p class="note">작은 칭찬이 오늘을 조금 더 따뜻하게 만들어줘요.</p>
</main>

<section class="section">
  <h2>완성한 스티커판</h2>
  <div id="history" class="history"><div class="empty">아직 완성한 판이 없어요.</div></div>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, push, set, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyArcYn-IGvNwm7tFTEh2dnl6AgmYg3YQkA",
 authDomain:"compliment-sticker-board-f6f59.firebaseapp.com",
 databaseURL:"https://compliment-sticker-board-f6f59-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"compliment-sticker-board-f6f59",
 storageBucket:"compliment-sticker-board-f6f59.firebasestorage.app",
 messagingSenderId:"848778478635",
 appId:"1:848778478635:web:a303bf95a05c6477d5166e"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);
const currentRef=ref(db,"board/current");
const historyRef=ref(db,"board/history");

let current={size:20, stickers:[], name:""}, uid=null, listening=false;
const symbols=["☘","❀","✦","✿"];

const $=id=>document.getElementById(id);
function status(t,error=false){$("status").textContent=t;$("status").className="status"+(error?" error":"");}
function normalize(b){
 if(!b || typeof b!=="object") return {size:20,stickers:[],name:""};
 const size=Math.min(31,Math.max(15,Number(b.size)||20));
 const stickers=Array.from({length:size},(_,i)=>b.stickers?.[i]||null);
 const name=typeof b.name==="string"?b.name:"";
 return {size,stickers,name};
}
function render(){
 $("size").value=String(current.size);
 const nameInput=$("boardName");
 if(document.activeElement!==nameInput) nameInput.value=current.name||"";
 const g=$("grid"); g.innerHTML="";
 current.stickers.forEach((s,i)=>{
   const d=document.createElement("div");
   d.className="slot"+(s?" filled sticker"+(((s-1)%4)+1):"");
   d.textContent=s?symbols[s-1]:"";
   d.title=s?"스티커를 빼려면 다시 눌러주세요":"스티커 붙이기";
   d.onclick=()=>toggle(i);
   g.appendChild(d);
 });
}
function renderHistory(data){
 const h=$("history"); h.innerHTML="";
 const entries=Object.entries(data||{}).sort((a,b)=>(b[1]?.createdAt||0)-(a[1]?.createdAt||0));
 if(!entries.length){h.innerHTML='<div class="empty">아직 완성한 판이 없어요.</div>';return;}
 entries.forEach(([id,b])=>{
   const card=document.createElement("div");card.className="card";
   const date=new Date(b.createdAt||Date.now()).toLocaleString("ko-KR",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
   const nb=normalize(b);
   const mini=document.createElement("div");mini.className="mini";
   nb.stickers.forEach(s=>{const x=document.createElement("span");x.textContent=s?symbols[s-1]:"";mini.appendChild(x)});
   const nm=document.createElement("div");nm.className="cardname";nm.textContent=nb.name||"이름 없음";
   const cd=document.createElement("div");cd.className="carddate";cd.textContent=date;
   const btns=document.createElement("div");btns.className="cardbtns";
   const restore=document.createElement("button");restore.textContent="복구";restore.onclick=async()=>{await set(currentRef,nb);window.scrollTo({top:0,behavior:"smooth"});};
   const del=document.createElement("button");del.textContent="삭제";del.onclick=async()=>{if(confirm("이 완성판을 삭제할까요?")){await set(ref(db,"board/history/"+id),null);}};
   btns.append(restore,del);card.append(nm,cd,mini,btns);h.appendChild(card);
 });
}
async function toggle(i){
 if(!uid)return;
 const before=current.stickers.slice();
 const next=before[i]?null:((i%4)+1);
 const result=await runTransaction(currentRef,b=>{
   const n=normalize(b);n.stickers[i]=next;return n;
 });
 const final=normalize(result.snapshot.val());
 if(final.stickers.every(Boolean)){
   const historyId=push(historyRef).key;
   await set(ref(db,"board/history/"+historyId),{...final,createdAt:Date.now()});
   await set(currentRef,{size:final.size,stickers:Array(final.size).fill(null),name:""});
 }
}
async function saveName(v){
 if(!uid)return;
 v=(v||"").slice(0,30);
 current.name=v;
 await update(currentRef,{name:v});
}
$("boardName").addEventListener("change",e=>saveName(e.target.value.trim()));
$("boardName").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur();});
$("addBtn").onclick=()=>{const i=current.stickers.findIndex(x=>!x);if(i>=0)toggle(i);};
$("resetBtn").onclick=()=>{if(confirm("현재 판의 스티커를 모두 지울까요?"))set(currentRef,{size:current.size,stickers:Array(current.size).fill(null),name:current.name||""});};
$("newBtn").onclick=()=>{if(confirm("새 판을 시작할까요? 이름을 새로 지어줄 수 있어요."))set(currentRef,{size:current.size,stickers:Array(current.size).fill(null),name:""});};
$("size").onchange=()=>{const size=Number($("size").value);set(currentRef,{size,stickers:Array(size).fill(null),name:current.name||""});};

render(); // paint an empty board immediately so the UI never looks blank while Firebase connects

onValue(currentRef,s=>{current=normalize(s.val());render();},err=>{console.error(err);status("데이터를 불러오지 못했습니다: "+(err.code||err.message),true);});
onValue(historyRef,s=>renderHistory(s.val()),err=>{console.error(err);});

onAuthStateChanged(auth,user=>{
 if(user){uid=user.uid;if(!listening){listening=true;status("● 실시간 연결됨");}}
});
signInAnonymously(auth).catch(e=>{
 console.error(e);
 status("Firebase 연결 실패: "+(e.code||e.message),true);
});
</script>
</body>
</html>
