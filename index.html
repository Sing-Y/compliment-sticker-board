<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>칭찬 스티커판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#8ea99a; --sage-dark:#668273; --sage-pale:#eaf1ed;
  --cream:#faf8f2; --ink:#37443d; --muted:#7c8881; --line:#dce5df;
  --white:#fff; --shadow:0 12px 35px rgba(57,76,66,.08);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f8faf7 0%,#f4f7f3 100%);color:var(--ink);font-family:"Noto Sans KR",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 70px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-family:"Gowun Dodum",sans-serif;font-size:34px;font-weight:400;margin:0 0 5px;letter-spacing:-1px}
.sub{font-size:13px;color:var(--muted)}
.status{font-size:12px;padding:7px 11px;border-radius:999px;background:var(--sage-pale);color:var(--sage-dark);white-space:nowrap}
.card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.controls{padding:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 13px;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--sage)}
.name{min-width:220px;flex:1}
.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--sage);color:#fff;font-weight:600}
.btn.secondary{background:#edf2ee;color:var(--sage-dark)}
.btn.ghost{background:#fff;color:var(--sage-dark);border:1px solid var(--line)}
.board-card{margin-top:14px;padding:22px}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.board-title{font-family:"Gowun Dodum";font-size:24px}
.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border:1px solid #dbe4de;background:#f7faf7;border-radius:50%;display:grid;place-items:center;padding:0;transition:.16s;position:relative}
.slot:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(60,80,70,.1)}
.sticker{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;font-size:clamp(12px,2.7vw,22px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.leaf{background:#dceadf}.flower{background:#f1e3df}.clover{background:#e7ead5}.star{background:#eee8d7}
.slot small{position:absolute;bottom:2px;right:4px;font-size:8px;color:#a2ada6;opacity:.65}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.hint{font-size:12px;color:var(--muted);margin-top:12px}
.section{margin-top:30px}
.section h2{font-family:"Gowun Dodum";font-weight:400;font-size:22px;margin:0 0 12px}
.archive{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.archive-card{padding:13px;border:1px solid var(--line);background:#fff;border-radius:17px}
.archive-top{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:9px}
.archive-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.archive-date{font-size:10px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mini i{aspect-ratio:1;border-radius:50%;background:#edf2ee;display:block}
.mini i.on{background:#a9c0b1;box-shadow:inset 0 -1px 0 rgba(0,0,0,.05)}
.empty{padding:24px;border:1px dashed var(--line);border-radius:17px;color:var(--muted);text-align:center;font-size:13px}
.notice{margin-top:12px;font-size:12px;color:var(--muted)}
@media(max-width:600px){
  .wrap{padding:20px 12px 50px}
  header{align-items:flex-start;flex-direction:column}
  h1{font-size:29px}
  .controls{padding:14px}
  .name{min-width:0;width:100%}
  .board-card{padding:14px}
  .board-head{margin-bottom:13px}
  .board-title{font-size:20px}
  .grid{gap:6px}
  .archive{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>칭찬 스티커판</h1>
    <div class="sub">작은 칭찬을 하나씩, 함께 채워가는 기록</div>
  </div>
  <div class="status" id="status">연결 중…</div>
</header>

<section class="card controls">
  <input class="name" id="boardName" placeholder="이번 판 이름 (예: 9월 칭찬판)" maxlength="40">
  <label>칸
    <select id="size"></select>
  </label>
  <button class="btn" id="addBtn">＋ 스티커 하나 붙이기</button>
  <button class="btn secondary" id="newBtn">새 판 만들기</button>
  <button class="btn ghost" id="resetBtn">현재 판 초기화</button>
</section>

<section class="card board-card">
  <div class="board-head">
    <div class="board-title" id="title">칭찬 스티커판</div>
    <div class="count" id="count">0 / 20</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <button class="btn" id="addBtn2">＋ 스티커 하나 붙이기</button>
  </div>
  <div class="hint">스티커 칸을 다시 누르면 그 칸의 스티커가 사라져요. 여러 기기에서 같은 판을 함께 사용할 수 있어요.</div>
</section>

<section class="section">
  <h2>완성한 판</h2>
  <div id="archive" class="archive"></div>
  <div id="empty" class="empty">아직 완성한 판이 없어요.</div>
  <div class="notice">이 사이트의 기록은 Firebase에 저장되어 같은 사이트에 접속한 기기에서 공유됩니다.</div>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, update } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAwjte9dCsdUkVF-BIv2XGuVVDZ9y7ki0",
  authDomain: "compliment-sticker-board.firebaseapp.com",
  projectId: "compliment-sticker-board",
  databaseURL: "https://compliment-sticker-board-default-rtdb.asia-southeast1.firebasedatabase.app",
  storageBucket: "compliment-sticker-board.firebasestorage.app",
  messagingSenderId: "1077338874909",
  appId: "1:1077338874909:web:987be6e8943ab0b8f192f4",
  measurementId: "G-TBB5KCPZPT"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const currentRef = ref(db, "board/current");
const historyRef = ref(db, "board/history");

let current = null, history = {}, uid = null;

const $ = id => document.getElementById(id);
const sizeSel = $("size");
for(let n=15;n<=31;n++){ const o=document.createElement("option");o.value=n;o.textContent=n+"칸";sizeSel.appendChild(o); }
sizeSel.value="20";

function makeNew(size=20){
  const id = "b_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
  return {id, name:"칭찬 스티커판", size, marks:{}, completed:false, createdAt:Date.now()};
}
function countMarks(b){ return b && b.marks ? Object.keys(b.marks).filter(k=>Number(k)<=Number(b.size)).length : 0; }
function family(i){ return ["leaf","flower","clover","star"][i%4]; }
function symbol(i){ return ["•","○","✦","·"][i%4]; }

function render(){
  if(!current) return;
  const size=Number(current.size)||20;
  $("boardName").value=current.name||"칭찬 스티커판";
  $("size").value=String(size);
  $("title").textContent=current.name||"칭찬 스티커판";
  const count=countMarks(current);
  $("count").textContent=`${count} / ${size}`;
  const cols=size<=18?6:size<=24?6:7;
  $("grid").style.setProperty("--cols",cols);
  $("grid").innerHTML="";
  for(let i=1;i<=size;i++){
    const b=document.createElement("button"); b.className="slot"; b.dataset.i=i;
    const val=current.marks?.[i];
    if(val){
      const s=document.createElement("span"); s.className="sticker "+family(val-1); s.textContent=symbol(val-1); b.appendChild(s);
    } else {
      const sm=document.createElement("small"); sm.textContent=i; b.appendChild(sm);
    }
    b.addEventListener("click",()=>toggle(i));
    $("grid").appendChild(b);
  }
  renderArchive();
}
function renderArchive(){
  const arr=Object.values(history||{}).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  $("archive").innerHTML="";
  $("empty").style.display=arr.length?"none":"block";
  for(const item of arr){
    const card=document.createElement("div");card.className="archive-card";
    const top=document.createElement("div");top.className="archive-top";
    const nm=document.createElement("div");nm.className="archive-name";nm.textContent=item.name||"칭찬 스티커판";
    const dt=document.createElement("div");dt.className="archive-date";dt.textContent=new Date(item.completedAt||Date.now()).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"});
    top.append(nm,dt); card.appendChild(top);
    const mini=document.createElement("div");mini.className="mini";
    const sz=Number(item.size)||20;
    for(let i=1;i<=sz;i++){const x=document.createElement("i");if(item.marks?.[i])x.classList.add("on");mini.appendChild(x)}
    card.appendChild(mini); $("archive").appendChild(card);
  }
}
async function toggle(i){
  if(!uid) return alert("잠시만요. 서버 연결 중이에요.");
  await runTransaction(currentRef, b=>{
    b=b||makeNew(Number(sizeSel.value));
    b.marks=b.marks||{};
    if(b.completed) return b;
    if(b.marks[i]) delete b.marks[i];
    else b.marks[i]=(countMarks(b)%4)+1;
    const c=countMarks(b);
    if(c>=Number(b.size)){ b.completed=true; b.completedAt=Date.now(); }
    return b;
  });
  await maybeArchive();
}
async function maybeArchive(){
  const b=current;
  if(b?.completed && b.id){
    await update(ref(db,"board/history/"+b.id), {...b});
  }
}
$("addBtn").onclick=()=>{ for(let i=1;i<=Number(current?.size||20);i++) if(!current?.marks?.[i]){toggle(i);break;} };
$("addBtn2").onclick=()=>$("addBtn").click();

$("resetBtn").onclick=async()=>{
  if(!uid)return;
  if(confirm("현재 판의 스티커를 모두 지울까요?")){
    await runTransaction(currentRef,b=>{
      b=b||makeNew(Number(sizeSel.value)); b.marks={}; b.completed=false; b.completedAt=null; return b;
    });
  }
};
$("newBtn").onclick=async()=>{
  if(!uid)return;
  const old=current;
  if(old && !old.completed && countMarks(old)>0 && !confirm("아직 완성되지 않은 현재 판을 버리고 새 판을 만들까요?")) return;
  if(old?.completed) await update(ref(db,"board/history/"+old.id), {...old});
  await update(currentRef, makeNew(Number(sizeSel.value)));
};
$("boardName").addEventListener("change",async e=>{
  if(!uid)return;
  await update(currentRef,{name:e.target.value.trim()||"칭찬 스티커판"});
});
$("size").addEventListener("change",async e=>{
  if(!uid)return;
  const size=Number(e.target.value);
  await runTransaction(currentRef,b=>{
    b=b||makeNew(size); b.size=size; b.marks=b.marks||{};
    for(const k of Object.keys(b.marks)) if(Number(k)>size) delete b.marks[k];
    b.completed=countMarks(b)>=size; return b;
  });
});

onValue(currentRef,s=>{current=s.val()||makeNew(20);render();});
onValue(historyRef,s=>{history=s.val()||{};renderArchive();});
onAuthStateChanged(auth,user=>{
  if(user){uid=user.uid;$("status").textContent="● 실시간 연결됨";}
});
signInAnonymously(auth).catch(err=>{
  console.error(err); $("status").textContent="연결 설정 확인 필요";
  alert("Firebase 익명 로그인이 꺼져 있거나 보안 규칙 설정이 필요합니다.");
});
</script>
</body>
</html>
